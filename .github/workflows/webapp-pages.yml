# webapp/ 을 GitHub Pages(https://jae-yoonlee.github.io/su_sibop/)에 배포한다.
# 처음 한 번: 저장소 Settings → Pages → Source를 "GitHub Actions"로 바꿔야 한다.
name: webapp-pages

on:
  push:
    branches: [main]
    paths: ["webapp/**", "data/eval/**", ".github/workflows/webapp-pages.yml"]
  pull_request:
    paths: ["webapp/**", "data/eval/**", ".github/workflows/webapp-pages.yml"]
  workflow_dispatch:

# 기본은 읽기만. 배포 권한은 deploy 작업에만 준다 (PR 빌드가 배포 권한을 갖지 않게)
permissions:
  contents: read

concurrency:
  group: webapp-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

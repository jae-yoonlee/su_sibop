<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LocalCoach 정확도 평가</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .eval-menu { max-width: 760px; margin: 32px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 14px; }
    .eval-menu img { width: 240px; border-radius: 8px; border: 1px solid var(--grid); }
    .tasks { display: grid; gap: 10px; }
    .tasks button { text-align: left; padding: 14px 16px; font-size: 18px; cursor: pointer;
      background: var(--panel); border: 1px solid var(--grid); border-radius: 8px; }
    .tasks button span { display: block; font-size: 14px; color: var(--muted); margin-top: 4px; }
    #report { white-space: pre-wrap; background: var(--panel); border: 1px solid var(--grid); border-radius: 8px;
      padding: 16px; font-size: 14px; line-height: 1.6; }
    #stage { position: fixed; inset: 0; background: #fff; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px; padding: 8vh 8vw; text-align: center; }
    #msg { font-size: 44px; font-weight: 700; }
    #sub { font-size: 30px; line-height: 1.7; max-width: 1100px; word-break: keep-all; }
    #dot { position: fixed; width: 36px; height: 36px; margin: -18px; border-radius: 50%; background: var(--alert); }
    #bar { position: fixed; left: 0; bottom: 0; height: 8px; background: var(--accent); }
    #hint { position: fixed; top: 12px; right: 16px; font-size: 14px; color: var(--muted); }
  </style>
</head>
<body>
  <div id="menu" class="eval-menu">
    <h1>정확도 평가 <span class="sub">지시를 따라 하면 녹화하고 채점합니다</span></h1>
    <p class="lead">화면의 지시가 곧 정답입니다. 지시한 시각과 내용, 웹캠 영상, 마이크 소리, 프레임별 분석값을
      <b>recordings/</b> 폴더에 저장하고, 끝나면 바로 결과 표를 보여 줍니다. 녹화는 이 PC에만 남습니다.</p>
    <img src="/video.mjpg" alt="웹캠 화면">
    <div class="tasks">
      <button data-task="gaze">눈동자 5방향 <span>고개는 그대로 두고 눈으로만 빨간 점(가운데·왼쪽·오른쪽·위·아래)을 따라갑니다. 3바퀴, 약 1분 20초</span></button>
      <button data-task="rate">발화속도 <span>글 두 편을 느리게·보통·빠르게 소리 내어 읽습니다. 다 읽으면 스페이스. 약 3분 (마이크 필요)</span></button>
      <button data-task="filler">소리 기반 군말 <span>문장 읽기와 "음—", "어—" 소리 내기를 번갈아 합니다. 약 1분 30초 (마이크 필요)</span></button>
    </div>
    <p id="error" class="error" hidden></p>
    <pre id="report" hidden></pre>
    <a href="/">← 연습 화면으로</a>
  </div>

  <div id="stage" hidden>
    <div id="hint">Esc: 그만두기 (그때까지 저장)</div>
    <div id="msg"></div>
    <div id="sub"></div>
    <div id="dot" hidden></div>
    <div id="bar"></div>
  </div>

  <script src="/eval.js"></script>
</body>
</html>
